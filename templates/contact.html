{% extends "base.html" %}

{% block title %}Contact Us - Fruit AI Team{% endblock %}

{% block content %}
<div style="padding-top: 120px; min-height: 100vh;">
    <div class="container">
        <!-- Header Section -->
        <div class="text-center mb-5 fade-in-up">
            <h1 class="section-title">Get In Touch</h1>
            <p class="section-subtitle">
                Have questions about our AI fruit detection system? We'd love to hear from you!
            </p>
        </div>


    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const contactForm = document.getElementById('contactForm');

        contactForm.addEventListener('submit', function (e) {
            e.preventDefault();

            // Get form data
            const formData = {
                firstName: document.getElementById('firstName').value,
                lastName: document.getElementById('lastName').value,
                email: document.getElementById('email').value,
                subject: document.getElementById('subject').value,
                message: document.getElementById('message').value
            };

            // Show success message (simulate form submission)
            alert('Thank you for your message! We will get back to you soon.');

            // Reset form
            contactForm.reset();
        });
    });
</script>
{% endblock %}
